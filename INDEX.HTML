<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dj SalvaTps1 | Sitio Oficial</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #b3b8c2;
        }
        .btn {
            background-color: #00ffcc;
            color: #0d0e12;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00b386;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 Dj SalvaTps1 ⚡</h1>
        <p>¡Bienvenido al espacio oficial! El cuartel general donde se cocina la música, los sets más potentes y el código de mi sitio web. ¡Sube el volumen! 🚀🔥</p>
        <a href="https://soundcloud.com" target="_blank" class="btn">Escuchar mis Sets en SoundCloud</a>
    </div>
</body>
</html>
